info:
  name: Change Password
  type: http
  seq: 7

http:
  method: POST
  url: '{{BASE_URL}}/{{AUTH_ENDPOINT}}/change-password'
  body:
    type: json
    data: |-
      {
        "oldPassword": "12345678",
        "newPassword": "87654321"
      }
  auth:
    type: bearer
    token: '{{ACCESS_TOKEN}}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
