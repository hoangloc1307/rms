services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rms-api-dev
    working_dir: /app
    command: npm run dev:api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rms_admin:strong_password@postgres:5432/rms_dev
      SMTP_HOST: mailhog
      REDIS_HOST: redis
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
    ports:
      - '5000:5000'
      - '9229:9229'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/app:delegated
      - rms_node_modules:/app/node_modules
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rms-worker-dev
    working_dir: /app
    command: npm run dev:worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rms_admin:strong_password@postgres:5432/rms_dev
      SMTP_HOST: mailhog
      REDIS_HOST: redis
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
    ports:
      - '9230:9230'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/app:delegated
      - rms_node_modules:/app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: rms-postgres-dev
    environment:
      POSTGRES_DB: rms_dev
      POSTGRES_USER: rms_admin
      POSTGRES_PASSWORD: strong_password
    ports:
      - '5432:5432'
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rms_admin -d rms_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rms-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - rms_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rms-mailhog-dev
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    restart: unless-stopped

volumes:
  rms_node_modules:
  rms_postgres_data:
  rms_redis_data:
