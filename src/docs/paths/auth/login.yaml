post:
  tags:
    - Auth
  summary: Login
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            username:
              type: string
              required: true
            password:
              type: string
              required: true
        example:
          username: '12314092'
          password: '12345678'
  responses:
    200:
      description: Login success
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
                properties:
                  token:
                    type: string
          example:
            success: true
            message: Success
            data:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIxMjMxNDA5MiIsImlhdCI6MTc3NDk2Mzg4NywiZXhwIjoxNzc0OTY0Nzg3fQ.JlKfOXOhQOs8I1OFitFH5Hg-kGka92bvCakkwPUMyPU
    400:
      description: Invalid request
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
              message:
                type: string
              meta:
                type: object
              errorCode:
                type: string
          example:
            success: false
            message: Validation Error
            meta:
              body.password: 'Password must be at least 8 characters'
            errorCode: 'BAD_REQUEST'
    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: Invalid username or password
            errorCode: 'UNAUTHORIZED'
