post:
  tags:
    - Auth
  summary: Logout
  security:
    - bearerAuth: []
  responses:
    200:
      description: Logout success
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
          example:
            success: true
            message: 'Logout successfully!'
            data: null
    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'Missing token'
            errorCode: 'UNAUTHORIZED'
