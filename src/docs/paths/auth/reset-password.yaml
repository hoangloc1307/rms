post:
  tags:
    - Auth
  summary: Reset password
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            token:
              type: string
            password:
              type: string
        example:
          token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIxMjMxNDA5MiIsImlhdCI6MTc3NDk2Mzg4NywiZXhwIjoxNzc0OTY0Nzg3fQ.JlKfOXOhQOs8I1OFitFH5Hg-kGka92bvCakkwPUMyPU'
          password: 'new-password'
  responses:
    200:
      description: Reset password success
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
          example:
            success: true
            message: 'Password has been reset successfully.'
            data: null
    400:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              meta:
                type: object
              errorCode:
                type: string
          example:
            success: false
            message: 'Validation Error'
            meta:
              body.newPassword: 'Password must be at least 8 characters'
            errorCode: 'BAD_REQUEST'
    401:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'Invalid or expired reset token'
            errorCode: 'UNAUTHORIZED'
