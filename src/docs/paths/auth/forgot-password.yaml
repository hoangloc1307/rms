post:
  tags:
    - Auth
  summary: Forgot password
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
        example:
          email: 'user.email@gmail.com'
  responses:
    200:
      description: Forgot password success
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
          example:
            success: true
            message: 'Password reset instructions have been sent to your email.'
            data: null
    404:
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'No account associated with this email'
            errorCode: 'NOT_FOUND'
