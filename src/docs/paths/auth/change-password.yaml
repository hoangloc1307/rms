post:
  tags:
    - Auth
  summary: Change password
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            oldPassword:
              type: string
            newPassword:
              type: string
        example:
          oldPassword: 'oldPassword'
          newPassword: 'newPassword'
  responses:
    200:
      description: Change password success
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
          example:
            success: true
            message: 'Password has been changed successfully.'
            data: null
    400:
      description: Invalid old password
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'Invalid old password'
            errorCode: 'BAD_REQUEST'
    404:
      description: User not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'User not found'
            errorCode: 'NOT_FOUND'
