post:
  tags:
    - Auth
  summary: Register
  requestBody:
    required: true
    content:
      application/json:
        schema:
          properties:
            username:
              type: string
              required: true
            name:
              type: string
              required: true
            email:
              type: string
              required: true
        example:
          username: '12314092'
          name: 'Trần Nguyễn Hoàng Lộc'
          email: 'user.email@gmail.com'
  responses:
    201:
      description: Register success
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
              message:
                type: string
              data:
                type: object
          example:
            success: true
            message: Register successfully!
            data: null
    400:
      description: Bad request
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
              message:
                type: string
              meta:
                type: object
              errorCode:
                type: string
          example:
            success: false
            message: Validation Error
            meta:
              body.email: 'Email is required'
            errorCode: 'BAD_REQUEST'
    409:
      description: Conflict
      content:
        application/json:
          schema:
            properties:
              success:
                type: boolean
              message:
                type: string
              errorCode:
                type: string
          example:
            success: false
            message: 'Username already exists'
            errorCode: 'CONFLICT'
